<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PanoCoTA logo concept 1 symbol</title>
  <desc id="desc">A panna-cotta-inspired dome with panorama horizon line and hotspot pulse.</desc>

  <defs>
    <linearGradient id="bg" x1="84" y1="70" x2="556" y2="562" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F2D25"/>
      <stop offset="1" stop-color="#132019"/>
    </linearGradient>
    <linearGradient id="dome" x1="188" y1="180" x2="426" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F9FFF3"/>
      <stop offset="1" stop-color="#DFF0E8"/>
    </linearGradient>
    <linearGradient id="syrup" x1="178" y1="390" x2="462" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E84855"/>
      <stop offset="1" stop-color="#BD3342"/>
    </linearGradient>
    <filter id="shadow" x="74" y="70" width="492" height="518" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="14"/>
      <feGaussianBlur stdDeviation="10"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.07 0 0 0 0 0.05 0 0 0 0.42 0"/>
      <feBlend in2="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="104" y="96" width="432" height="432" rx="72" fill="url(#bg)"/>

    <!-- Panna cotta dome -->
    <path d="M178 366C178 250 265 174 320 174C375 174 462 250 462 366V386H178V366Z" fill="url(#dome)"/>

    <!-- Panorama horizon carved into the dome -->
    <path d="M214 316C246 296 286 286 320 286C354 286 394 296 426 316" stroke="#21352B" stroke-width="11" stroke-linecap="round"/>

    <!-- Syrup base layer -->
    <rect x="178" y="386" width="284" height="34" rx="17" fill="url(#syrup)"/>

    <!-- Hotspot pulse -->
    <circle cx="402" cy="294" r="11" fill="#E84855"/>
    <circle cx="402" cy="294" r="22" stroke="#E84855" stroke-opacity="0.64" stroke-width="4"/>
    <circle cx="402" cy="294" r="34" stroke="#E84855" stroke-opacity="0.34" stroke-width="3"/>
  </g>
</svg>
